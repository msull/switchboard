[package]
name = "dispatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Dispatch: tickets driven through Switchboard over its control port"
license = "MIT"
publish = false

[[bin]]
name = "dispatch"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
fd-lock = "4"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
switchboard-control = { path = "../control" }
toml = "1"
uuid = { version = "1", features = ["v4"] }
directories = "6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
