You are the deploy check. You read; you change nothing. Nothing you do deploys, links an environment, touches AWS, or edits a file in the worktree. Your whole output is the notes file you were asked to write, and its first line is the verdict.'''

[[stages]]
name = "investigate"
operator = "investigator"
context = "root"
writes = ["notes"]
prompt = "This ticket carries someone else's pull requests, one per lane:\n{issue.body}\n\nEach lane's worktree in this workspace is checked out at its pull request's head; the lanes are {lanes}. Read the pull requests and write to {notes} what they change, whether the lanes agree, what a try on my-dev would have to exercise, and whether this ticket is worth the stack, ending with the QUEUE line."

[[stages]]
name = "review-code"           # two reviewers read each lane's branch; findings are a question (the dial below), answered fix rarely and never pushed
context = "each"
reviewers = ["correctness", "style"]
implementer = "implementer"
cap = 3
gate = { kind = "command", in = "lane", per_lane = { backend = ["sh", "-c", "docker info >/dev/null 2>&1 || { echo \"the Docker daemon is not running (colima start); the checks need it for the local DynamoDB container\"; exit 1; }; uv run --frozen --all-groups inv lint && git diff --exit-code && uv run --frozen --all-groups inv pytest"], frontend = ["sh", "-c", "CI=true npm test -- --watchAll=false --maxWorkers=3"], admin = ["sh", "-c", "CI=true npm test"] } }

[[stages]]
name = "deploy-check"          # what the deploy would do, read before anyone decides; skipped when the ticket has no backend lane
operator = "deploy-check"
context = "lane:backend"
writes = ["notes"]
prompt = "The backend branch {branch} in {worktree} is about to be deployed to my-dev: Dispatch runs `inv link-env --env-name my-dev` and then `inv deploy -f` from this worktree. Before that happens, work out what the deploy will do. Diff the branch against its integration branch (main) and read ./infra in full, not only its diff: the infrastructure is a SAM template (template.yaml), samconfig.toml, the table definitions under tables/ and the deps layer; `inv deploy` builds and deploys that template, and the invoke tasks in the repository's tasks module decide how. Application code changes what runs; a change under ./infra or in those tasks changes what exists. Confirm the branch targets my-dev and nothing else: no other stack, environment name, account or region is named or reachable from what changed. Then classify. `safe` means a code-only change inside the application that the deploy replaces in place and a redeploy of main would fully undo. `risk` means anything that creates, replaces, deletes or renames deployed resources, changes data, tables, indexes or schemas, runs a migration or a one-off script, changes permissions, roles or secrets, changes how an environment is linked, or would be hard to undo once deployed. If in any doubt, it is `risk`. Write to {notes}: the first line exactly `VERDICT: safe` or `VERDICT: risk`; then `Deploy will:` with what the deploy does in a few lines; then `Risks:` with one bullet per finding naming the file and why it is hard to undo, or the single word `none`."

[[stages]]
name = "inspect"               # the decision to queue: the deploy check's verdict is the Notes line of the question, the investigator's QUEUE line is in its notes. proceed puts the ticket in the queue for my-dev; park keeps it out (resume brings it back here); rerun with a note sends it back to the investigator
context = "each"
gate = { kind = "human", decision = "inspect", question = "Queue this ticket on my-dev? The investigation ends with its QUEUE line and the deploy check's verdict is on the Notes line. proceed deploys the backend branch (or the head of the backend's main when the ticket has no backend lane) and tries the served frontends behind every ticket already queued; park keeps it out of the queue; rerun with a note sends it back to the investigator." }

[[stages]]
name = "deploy"
context = "lane:backend"
without_lane = "base"         # a ticket with no backend lane deploys the head of the backend's main from the project's base tree, so its frontend is tried against merged code rather than whatever my-dev last held
needs = ["my-dev"]
# Dispatch deploys, once, after linking again so the target cannot be
# whatever a previous checkout left; the deployed commit is recorded
# on the attempt.
gate = { kind = "command", in = "lane:backend", argv = ["sh", "-c", "uv run --frozen --all-groups inv link-env --env-name my-dev && { out=$(aws-vault exec -n orchard-dev -- uv run inv deploy -f 2>&1); rc=$?; printf '%s\n' \"$out\"; [ \"$rc\" -eq 0 ] || printf '%s' \"$out\" | grep -q 'No changes to deploy'; }"] }   # sam deploy exits 1 on an empty changeset; a stack already at this branch counts as deployed

[[stages]]
name = "try"
operator = "tester"
context = "joined"
needs = ["my-dev"]
services = ["frontend", "admin"]   # each started only if the ticket carries that lane's pull request; owned by the ticket until `tried` ends
env = ["e2e"]                     # test personas on my-dev: E2E_<PERSONA>_USER/_PASSWORD and the stack, read by tools/e2e/persona.mjs
before = { frontend = ["sh", "-c", "cp \"$HOME/Library/Application Support/Dispatch/projects/Orchard/frontend.env.local\" .env.local && grep -q '^REACT_APP_API_ENDPOINT=https://api-my-dev' .env.local || { echo '.env.local does not point at my-dev; refusing to serve'; exit 1; }"] }   # the my-dev values the frontend's link-env would resolve from the stack outputs, kept as a file: link-env needs a set-up backend lane and AWS credentials, which a frontend-only ticket has neither of. admin has no link-env; it serves with its committed .env
writes = ["notes", { name = "evidence", dir = true }]    # listed on the attempt, counted in the tried question, printed by `dispatch evidence <ticket>`
prompt = "my-dev is running backend commit {inputs.deploy.commit}: this ticket's backend pull request, or the head of the backend's main when the ticket has no backend lane. The frontend: {services.frontend}. The admin frontend: {services.admin}. A lane this ticket does not carry is not served; test it, if at all, against the existing deployment. The investigation at {inputs.investigate.notes} says what to exercise. Try the pull requests ({issue.body}) end to end and report to {notes}. You have only what the running services give you: never look for credential files, AWS profiles, tokens or passwords on this machine, and never ask for them. Your test users are the personas in tools/e2e (run `npm install` there first; the browsers are already installed): `AS=admin` is a superuser for setting up the scenario, `AS=supervisor` supervises `AS=employee`. Confirm them first with `AS=supervisor npm run whoami`. API-level probes, seeders and `npm run token` mint their own token from the environment and need no frontend; browser probes need the served frontend and `AS=<name> npm run login` once per persona, which writes the session file into this workspace only. What you cannot reach with these three personas, report as not tried, with exactly what you would have done and what you expected to see. Save every screenshot and file you produce under {evidence}: run the probes with SHOT_DIR={evidence}, and write any other file there with the Write tool, never with cp, mv or mkdir. In your notes, name the files that show each result."

[[stages]]
name = "tried"
needs = ["my-dev"]        # still held: what you are looking at must stay deployed
gate = { kind = "human", decision = "tried", confirm = true }   # the tester's evidence and the deployed commit are shown; done releases the stack, rerun tests again on the same deploy

[[stages]]
name = "ready"
context = "each"
gate = { kind = "external", check = "pr-checks", provider = "bitbucket", checks = "none" }   # a collaborator's pull request on the GitHub mirror has no CI; the review-code gate already ran the lane's checks here

[[stages]]
name = "merge"
context = "each"
gate = { kind = "external", check = "pr-merged", provider = "bitbucket", decision = "merge" }   # pending on you until Bitbucket says merged; the merge itself is yours, by hand, on the author's pull request

[policy]
# slots and waiting_on_me are the project's, read from Orchard.toml for
# both files' tickets; the counts here are not read.
ports = [3100, 3199]         # for services; one per service per ticket, tested free before use
decisions = { lanes = "auto", inspect = "ask", review-code = "ask", merge = "ask" }   # lanes are named at take; inspect is the queue decision and stays yours
