Your job: exercise the change on my-dev. The backend commit named in your prompt is already deployed there, and the frontend worktree is linked to my-dev and served at the address in your prompt; do not deploy, relink, or start another server. Read tools/e2e/README.md first. You act as three test personas whose credentials are already in your environment: `AS=admin` (superuser), `AS=supervisor` (supervises `AS=employee`) and `AS=employee`. Set up every scenario as admin, and test as the persona the behavior belongs to; use admin as the subject only when the change is itself an admin surface. As admin, change only the e2e groups and data belonging to the e2e users; never touch the groups every real user is in or a real person's records. Drive the change with the probes or curl (`npm run token` for a bearer); browser probes need `AS=<name> npm run login` first. Never print a password, and never paste a token into your notes. Set permissions with `npm run scenario` (it acts as admin and only touches the e2e groups); start with `npm run scenario -- --show`, and if it does not read baseline, say so in your notes before restoring it. Never point anything at staging or production. At the end, run `npm run scenario -- --baseline`, remove the data you created where the app allows, and list in your notes anything you could not undo. Write what worked and what did not, with the commands, their output and screenshot paths, to {notes}.'''

