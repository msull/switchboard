# Someone else's pull requests, read, tried on the one stack and signed
# off: the shape of the client's pull-request pipeline, with the guide's
# Orchard names (docs/dispatch.md, "Tickets from pull requests"), and the
# companion of pipelines/examples/Orchard.toml, whose lanes, resource and
# names it shares. A ticket is `dispatch take Orchard pr backend/123
# frontend/45` (or `github:backend/17` from a mirror): one pull request
# per lane, each lane's worktree checked out at its pull request's head.
# The lanes are the ones named at take, so there is no lanes gate; the
# dial below says `lanes = "auto"`.
#
# How a ticket runs: investigate reads every pull request and ends with
# a QUEUE line; review-code reads them with two reviewers, and its
# findings are a question (a fix is answered rarely, and never pushed);
# deploy-check says what the backend's deploy would do; inspect is the
# decision to queue, with the deploy check's verdict on its Notes line:
# proceed puts the ticket in the queue for my-dev, which deploy, try and
# tried hold one ticket at a time; park keeps it out. ready and merge
# watch the author's pull request; nothing here pushes. Dispatch refuses
# a rebaser or fixer in this file and any `commits` but keep: the
# branches are the author's.
#
# To take this to another machine, change what Orchard.toml's header
# lists: the names, the lanes' setup, serve and checks, the deploy gate,
# try's before and env set, the `provider` keys on ready and merge (drop
# them for GitHub), and the ground-rules paragraph repeated in every operator's guidance. To read
# without a code review, delete the review-code stage; the investigator's
# notes still reach the inspect question through the ticket's files.
version = 1

[project]
name = "Orchard"
repo = "git@github.com:example-org/orchard-workspace.git"
space = "Dispatch · Orchard"

[source]
kind = "pull-request"

[[lanes]]
name = "backend"
path = "orchard-backend"
repo = "git@bitbucket.org:example-co/orchard-backend.git"
remotes = { github = "git@github.com:example-org/orchard-backend.git" }   # the collaborators' mirror: dispatch take Orchard pr github:<lane>/<n>
base = "main"
setup = ["sh", "-c", "uv sync --frozen --all-groups && mkdir -p local/caches && uv run --frozen --all-groups inv link-env --env-name my-dev"]

[[lanes]]
name = "frontend"
path = "orchard-frontend"
repo = "git@bitbucket.org:example-co/orchard-frontend.git"
remotes = { github = "git@github.com:example-org/orchard-frontend.git" }
base = "dev"
setup = ["npm", "ci", "--legacy-peer-deps"]
# A service Dispatch starts for a stage that asks. PORT is a port
# Dispatch allocates per ticket; the URL is what the tester is told.
serve = { argv = ["npm", "start"], env = { BROWSER = "none", PORT = "{port}" }, url = "http://localhost:{port}", ready = { http = "/", within_secs = 120 } }

[[lanes]]
name = "admin"
path = "orchard-admin"
repo = "git@bitbucket.org:example-co/orchard-admin.git"
remotes = { github = "git@github.com:example-org/orchard-admin.git" }
base = "master"
setup = ["npm", "ci", "--legacy-peer-deps"]
serve = { argv = ["npm", "start"], env = { BROWSER = "none", PORT = "{port}" }, url = "http://localhost:{port}", ready = { http = "/", within_secs = 120 } }

[[resources]]
name = "my-dev"
count = 1

# Every operator reads; the implementer below is the one that writes,
# only when a review finding is answered fix, and it never pushes.
[operators.investigator]
kind = "claude"
guidance = '''Ground rules for every Orchard stage. Issues live in the example-org/orchard-workspace GitHub repository; the issue body you were given is a snapshot without comments, so read the comments with `gh issue view <n> -R example-org/orchard-workspace --comments` before relying on the body: decisions and scope changes are often recorded there. Each lane works on the branch Dispatch cut for it (the dispatch/... branch in its worktree); that name is accepted for Orchard PRs, so never cut, switch, rename or push under another name. my-dev is a backend-only stack: Dispatch deploys the backend lane's branch to it at the deploy stage, and at the try stage serves each chosen frontend lane's branch itself, on a port it picks, already linked to my-dev, and hands the tester that URL as the served frontend. A plan's try section therefore addresses my-dev and the served frontend by those names and tells nobody to run npm start, link-env, or a deploy; a review does not object to that wording, and a before/after comparison uses what the served frontend and my-dev show, not staging. Nothing you write or run deploys, links an environment to a different stack, edits deployed resources in the console, or promotes to staging or production. Anything that leaves the machine (commit messages, PR bodies) carries no Claude session link or attribution line, never mentions the planning workspace, its plans, guides or Dispatch, and never cites a workspace issue as `#n` or `example-org/orchard-workspace#n` (in Bitbucket `#n` links to an unrelated PR there): describe the problem in its own words. Never create, comment on, label or close GitHub issues, and never edit the workspace's guides/ or plans/; if you notice something out of scope, write it under a "Noticed" heading in your output for the lead. At the try stage the tester acts as three test personas on my-dev: admin (superuser, used for setup), supervisor, and employee (supervised by supervisor). A plan's try section says which persona does each step and what scenario admin sets up first, and needs no other accounts. Never run `inv launch-dynamodb-local` or any `docker run` with a fixed container name or host port (the `dynamodb-local` container on 8000 is a rarely used hand tool): the backend's tests start their own DynamoDB through pytest-docker on a free port, several tickets run on this machine at once, and nothing at try uses a local database; my-dev's tables are the only data store there. A change to the local table definition is verified by reading it and by the backend's own tests, not by launching DynamoDB Local. Jest spawns a worker per core and each takes about a gigabyte, so every frontend test run you start carries `--maxWorkers=3` (`CI=true npm test -- --watchAll=false --maxWorkers=3`, and the same flag on a coverage run); never run a watch-mode test, and never run two test runs at once. Search only inside your worktree and the Dispatch ticket directory your prompt names: never run `find`, `rg`, `grep -r` or `ls -R` on `/`, `~`, `/Users` or any other directory outside them. An installed package's source is in the lane's own `node_modules` (frontend, admin) or `.venv` (backend); when it is not there, say so in your output rather than searching the disk. A search outside the worktree walks other apps' data and stops the owner with a macOS permission prompt.

Your job: read someone else's pull requests, one per lane, each checked out in its lane's worktree at the pull request's head, and change nothing: no edits, no commits, no pushes, the branches are the author's. For each pull request: what it changes (files, endpoints, screens, with paths and line numbers), what its body claims and whether the diff bears each claim out, whether the lanes agree on the API contract and field casing (camelCase on the wire, snake_case in Python), whether the tests cover the change, whether a What's New or CHANGELOG entry is needed and present, and what a deploy of the backend branch to my-dev would change (read ./infra and the invoke tasks, not only their diff). Then say what a try on my-dev would have to exercise, persona by persona, and what it could not show. Put every question only the owner can answer under a heading Open questions. End with a line `QUEUE: yes` or `QUEUE: no` and the reason on the lines after it: yes when the change has a behaviour worth seeing on the stack, no when reading settles it or the branch is not ready (a claim the diff does not bear out, missing tests, a conflict with its base). Write nothing but your notes, and write them before your last turn ends.'''

