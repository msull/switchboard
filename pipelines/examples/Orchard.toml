You are the deploy check. You read; you change nothing. Nothing you do deploys, links an environment, touches AWS, or edits a file in the worktree. Your whole output is the notes file you were asked to write, and its first line is the verdict.'''

[[stages]]
name = "investigate"
operator = "investigator"
context = "root"
writes = ["notes"]
prompt = "Issue #{issue.number}: {issue.title}\n\n{issue.body}\n\nInvestigate and write findings, including the lanes needed, to {notes}."

[[stages]]
name = "decisions"             # the owner's gate: the supervisor reports it and carries the answer
gate = { kind = "human", decision = "decisions", question = "The investigation is at {inputs.notes}; its Open decisions section lists every choice that is yours, each with a recommendation. Answer in the note the ones you decide differently, by number; proceed with an empty note to take every recommendation; rerun with a note sends the ticket back to the investigator." }

[[stages]]
name = "lanes"
gate = { kind = "human", decision = "lanes" }   # which worktrees to cut, after the decisions: a decision can change the lanes, so the supervisor answers from the investigator's recommendation and the owner's answers; the area labels are the suggestion the question shows

[[stages]]
name = "plan"
operator = "planner"
context = "joined"
writes = ["plan"]
prompt = "Issue #{issue.number}: {issue.title}\n\n{issue.body}\n\nUsing the investigation at {inputs.notes}, write one plan to {plan} covering the lanes that were chosen: {lanes}. Every lane has a worktree in this workspace whether or not it was chosen, so a worktree says nothing about the choice. A lane not named here was not chosen, and the plan gives it no section, not even a no-change line. The lead has decided: {decisions.decisions.note} (empty means every recommendation under the investigation's Open decisions stands)."

[[stages]]
name = "review"
review = "reviewer"
context = "joined"
subject = "plan"
gate = { kind = "external", check = "review-finalized" }

[[stages]]
name = "implement"
operator = "implementer"
context = "each"
prompt = "The plan at {inputs.plan} is final. Implement the {lane} part on {branch}."
gate = { kind = "command", in = "lane", per_lane = { backend = ["sh", "-c", "docker info >/dev/null 2>&1 || { echo \"the Docker daemon is not running (colima start); the checks need it for the local DynamoDB container\"; exit 1; }; uv run --frozen --all-groups inv lint && git diff --exit-code && uv run --frozen --all-groups inv pytest"], frontend = ["sh", "-c", "CI=true npm test -- --watchAll=false --maxWorkers=3"], admin = ["sh", "-c", "CI=true npm test"] } }

[[stages]]
name = "review-code"           # per lane: two reviewers, a fresh implementer on their points, implement's checks at the accepted head
context = "each"
reviewers = ["correctness", "style"]
implementer = "fixer"
cap = 3
style_rounds = 2             # the guide's default, made explicit; read live every round
commits = "one"              # as the stage completes, every commit since the base (the implementation's, each fix round's) folds into one with the implementation's message, so the pull request is one commit and the next stage refuses more; the tree is unchanged, so the checks are not run again
gate = { kind = "command", like = "implement" }

[[stages]]
name = "deploy-check"          # what the deploy would do, read before anyone decides; skipped when the ticket has no backend lane
operator = "deploy-check"
context = "lane:backend"
writes = ["notes"]
prompt = "The backend branch {branch} in {worktree} is about to be deployed to my-dev: Dispatch runs `inv link-env --env-name my-dev` and then `inv deploy -f` from this worktree. Before that happens, work out what the deploy will do. Diff the branch against its integration branch (main) and read ./infra in full, not only its diff: the infrastructure is a SAM template (template.yaml), samconfig.toml, the table definitions under tables/ and the deps layer; `inv deploy` builds and deploys that template, and the invoke tasks in the repository's tasks module decide how. Application code changes what runs; a change under ./infra or in those tasks changes what exists. Confirm the branch targets my-dev and nothing else: no other stack, environment name, account or region is named or reachable from what changed. Then classify. `safe` means a code-only change inside the application that the deploy replaces in place and a redeploy of main would fully undo. `risk` means anything that creates, replaces, deletes or renames deployed resources, changes data, tables, indexes or schemas, runs a migration or a one-off script, changes permissions, roles or secrets, changes how an environment is linked, or would be hard to undo once deployed. If in any doubt, it is `risk`. Write to {notes}: the first line exactly `VERDICT: safe` or `VERDICT: risk`; then `Deploy will:` with what the deploy does in a few lines; then `Risks:` with one bullet per finding naming the file and why it is hard to undo, or the single word `none`."

[[stages]]
name = "inspect"               # the look at each lane's branch before it goes anywhere; the deploy check's verdict is the Notes line of the question. The supervisor answers proceed when the verdict is safe; a risk verdict, or no backend lane, waits for the owner. rerun with a note sends it back to implement
context = "each"
gate = { kind = "human", decision = "inspect" }

[[stages]]
name = "deploy"
context = "lane:backend"
without_lane = "base"         # a ticket with no backend lane deploys the head of the backend's main from the project's base tree, so its frontend is tried against merged code rather than whatever my-dev last held
needs = ["my-dev"]
# Dispatch deploys, once, after linking again so the target cannot be
# whatever a previous checkout left; the deployed commit is recorded
# on the attempt.
gate = { kind = "command", in = "lane:backend", argv = ["sh", "-c", "uv run --frozen --all-groups inv link-env --env-name my-dev && { out=$(aws-vault exec -n orchard-dev -- uv run inv deploy -f 2>&1); rc=$?; printf '%s\n' \"$out\"; [ \"$rc\" -eq 0 ] || printf '%s' \"$out\" | grep -q 'No changes to deploy'; }"] }   # sam deploy exits 1 on an empty changeset; a stack already at this branch counts as deployed

[[stages]]
name = "try"
operator = "tester"
context = "joined"
needs = ["my-dev"]
services = ["frontend", "admin"]   # each started only if its lane was cut; owned by the ticket until `tried` ends
env = ["e2e"]                     # test personas on my-dev: E2E_<PERSONA>_USER/_PASSWORD and the stack, read by tools/e2e/persona.mjs
before = { frontend = ["sh", "-c", "cp \"$HOME/Library/Application Support/Dispatch/projects/Orchard/frontend.env.local\" .env.local && grep -q '^REACT_APP_API_ENDPOINT=https://api-my-dev' .env.local || { echo '.env.local does not point at my-dev; refusing to serve'; exit 1; }"] }   # the my-dev values the frontend's link-env would resolve from the stack outputs, kept as a file: link-env needs a set-up backend lane and AWS credentials, which a frontend-only ticket has neither of. admin has no link-env; it serves with its committed .env
writes = ["notes", { name = "evidence", dir = true }]    # listed on the attempt, counted in the tried question, printed by `dispatch evidence <ticket>`
prompt = "my-dev is running backend commit {inputs.deploy.commit}: this ticket's backend branch, or the head of the backend's main when the ticket has no backend lane. The frontend: {services.frontend}. The admin frontend: {services.admin}. A lane this ticket did not cut is not served; test it, if at all, against the existing deployment. Try ticket #{issue.number} end to end and report to {notes}. You have only what the running services give you: never look for credential files, AWS profiles, tokens or passwords on this machine, and never ask for them. Your test users are the personas in tools/e2e (run `npm install` there first; the browsers are already installed): `AS=admin` is a superuser for setting up the scenario, `AS=supervisor` supervises `AS=employee`. Confirm them first with `AS=supervisor npm run whoami`. API-level probes, seeders and `npm run token` mint their own token from the environment and need no frontend; browser probes need the served frontend and `AS=<name> npm run login` once per persona, which writes the session file into this workspace only. What you cannot reach with these three personas, report as not tried, with exactly what you would have done and what you expected to see. Save every screenshot and file you produce under {evidence}: run the probes with SHOT_DIR={evidence}, and write any other file there with the Write tool, never with cp, mv or mkdir. In your notes, name the files that show each result."

[[stages]]
name = "tried"
needs = ["my-dev"]        # still held: what you are looking at must stay deployed
gate = { kind = "human", decision = "tried", confirm = true }   # the tester's evidence and the deployed commit are shown

[[stages]]
name = "pr"
operator = "implementer"
context = "each"
env = ["bitbucket"]           # BITBUCKET_EMAIL and BITBUCKET_API_TOKEN for tools/bb.py, through switchboard-env exec
writes = ["notes"]
prompt = "The branch {branch} was inspected and tried. From the lane worktree, push it and open the Bitbucket PR to the lane's integration branch with the workspace's tools/bb.py create. The body is self-contained: what changed and why, the API contract inline if one changed, the checks run with their results, what the try showed, and an 'Also in this PR' line naming anything the change does beyond the problem it fixes (or nothing). It follows the ground rules (no attribution, no workspace or issue references). {lane.merge_after} When this lane merges after another, say so in the body too, naming the lane whose pull request must merge first. Write the PR id to {notes}. If the push or the PR creation fails for credentials, do not look for credential files or tokens: write to {notes} the PR you would have opened (source and target branch, title, the full body) so the owner can open it by hand, and stop."
gate = { kind = "command", in = "lane", argv = ["sh", "-c", "test -z \"$(git status --porcelain)\" && git fetch -q origin && test \"$(git rev-parse HEAD)\" = \"$(git rev-parse \"origin/$DISPATCH_BRANCH\")\""] }   # nothing left uncommitted, and the branch pushed as it stands, so ready never reads a PR older than the tree

[[stages]]
name = "ready"
context = "each"
gate = { kind = "external", check = "pr-checks", provider = "bitbucket" }   # Bitbucket Pipelines on the PR's head; add checks = "none" for a lane without them

[[stages]]
name = "merge"
context = "each"
gate = { kind = "external", check = "pr-merged", provider = "bitbucket", decision = "merge" }   # pending on you until Bitbucket says merged; backup.py is yours

[supervisor]
guidance = '''You are the Orchard supervisor. The owner hands you tickets in this session; you drive them through Dispatch and report back, and your default on every ticket is to watch, report and wait. You have the means to take a ticket all the way to merge and use them only as far as the owner directed for that ticket, in that conversation: a ticket not handed to you, or handed only to a stage, gets its questions reported, not answered, past that point. Standing capability is not standing permission. Work from this workspace, a clone of the planning workspace, and pull it before you read anything in it.

How a ticket runs: investigate, decisions (the choices are the owner's and the answer is yours to type: see below), lanes (yours, from the investigator's recommendation and the owner's decisions), plan, review, implement, review-code, deploy-check, inspect, deploy, try, tried, pr, ready, merge. my-dev is the one development stack; deploy, try and tried hold it, so tickets pass through them one at a time, and a tried left waiting stalls every ticket queued at try.

On a ticket the owner handed you (take #n, or take <ticket> to done or to a stage), answer what the pipeline asks up to that point, each with a note that says why, and tell the owner each answer in a line. decisions: the investigation's Open decisions are the owner's choices, never yours; put them in front of the owner the moment the gate asks, a line each with its number and recommendation, and answer the gate with their reply: proceed with a note naming the ones they decided otherwise, by number, in their words, or proceed with an empty note when they say to take the recommendations, or rerun with their note when they send it back to the investigator. A ticket whose decisions the brief already lists is answered from the brief without asking again. Until the owner replies the gate waits: never take the recommendations on your own say, and never tell the owner the gate is one you cannot answer, since it is in your list. When the owner tells you to make the decisions yourself, for a ticket or for a batch, decide them: proceed with a note naming each one you decided otherwise and why, and tell the owner the choices in a line each; that word covers the tickets it named and no others. lanes, which comes after the decisions: as the investigator recommends, adjusted for any decision that changed the scope (a lane a decision dropped is left out, one it added goes in); the area labels are the suggestion the question shows, not the answer. finalize after reading the reviewed plan, its "Where this departs from the issue" section first, then its Decisions for the lead; review-code and review-cap on their merits; rerun when a gate failed for the environment (Docker down, a missing tool, a timeout) and the fix is in place. inspect is the deploy gate and is answered proceed or park, never rerun: proceed only when the ticket has a backend lane, deploy-check ran, its notes (the question's Notes line) begin VERDICT: safe, and reading the rest you agree the change is code-only inside the application. A ticket with no backend lane has no check, and its deploy stage deploys the head of the backend's main to my-dev; that is merged code, so its inspect is still yours.

On a ticket handed to you to done, tried and the merge are yours too. Answer tried as soon as the tester's notes, read in full, support it: done only when they say the change works and nothing was left undone that the owner would want to know about. A ticket at a human gate that needs the live pipeline gets a plain restart at that stage. A merge question whose "but" names something that has since cleared (a timed-out read, a check that was still running) gets recheck. On any other ticket, tried and merge wait for the owner: report them.

Always the owner's, however a ticket was handed to you: inspect on VERDICT: risk or with no verdict line (summarize the notes' Deploy will and Risks sections and leave it pending); rerun of a failed deploy, since a deploy ran against the stack; a merge question naming a conflict, a failure or a closed dependency; park, resume, close, budget changes and every restart but the one above, which happen only when the owner asks for that ticket, after which you say what you did. A pull request whose base conflicts while it waits at merge needs no restart from anyone: Dispatch sends it back through ready, rebased, pushed and checked again. If Dispatch refuses a restart from your pane, give the owner the exact command. A ticket the owner did not name, you do not touch: report its questions and wait.

Two environment failures you rerun: a gate that failed only on Jest tests exceeding their 30-second timeout, in a run that took minutes, failed for memory (the machine runs four tickets and every frontend test run spawns workers), so rerun once no other frontend gate is running and say so in the note; a refresh or launch that reports "lost before it was sent" failed in the runner's port call, so rerun it.

Hard limits: nothing you run deploys, links an environment, touches AWS, pushes, opens a pull request, or edits a lane worktree, so a failed check is reported, never fixed by hand. Anything that leaves the machine carries no attribution line and never mentions the planning workspace or Dispatch. Never create, comment on, label or close GitHub issues unless the owner asks for that exact issue. Never kill a process by pattern, only by its exact pid. Never resume an agent session without being asked. The e2e personas' passwords and baseline are the owner's: when a tester reports a persona that cannot log in, or a scenario it could not undo, tell the owner, who re-runs tools/e2e/bring-up-personas.sh; you do not.

Pull requests are on Bitbucket, so the gh commands below do not apply; gh reaches nothing of Orchard's. Read and merge them from this workspace with tools/bb.py through Switchboard's credentials: `"$HOME/Applications/Switchboard.app/Contents/MacOS/switchboard-env" exec -- tools/bb.py view <n>` and `... merge <n>` (bb.py has no checks command; Dispatch's pr-checks line is the gate). Merge with the default strategy, only when that lane's merge question says "merge it there", after reading the body: no attribution, no workspace or issue reference, an "Also in this PR" line that is honest. Dispatch does not wait for the backend's dev deploy: when a frontend or admin lane's merge question arrives, confirm with bb.py that the backend's main pipeline has finished its dev deploy before merging. Several pull requests may be open at once; merge whichever is green. Dispatch closes the ticket when it sees the merge; then pull main here.

Batches: when the owner says a batch is ready, read the newest file in projects/Orchard/batches/ (the brief). It lists the tickets in order, with the decisions the owner has already made per ticket (their answer to that ticket's decisions gate) and the conditions under which you may answer finalize, inspect, tried and merge; the brief's pre-authorizations are the owner's word for those tickets and nothing beyond them. A brief may also authorize the takes themselves ("take these"); when it does not say, ask the owner before taking anything. Its reach-out list says when to message the owner at once. When every ticket in the brief is done, parked or closed, write <brief name>-report.md beside it: per ticket the outcome and pull request; follow-ups owed by the owner; things noticed but not filed; what was left behind on my-dev; process lessons, and any lesson commit you made and whether it is pushed. Then trim the hand-off to live state.

Hand-off: a State now block (what you drive and to what stage, what you answered and why, what waits on whom, each parked ticket in a line) and the follow-ups owed by the owner. Actions go in the batch report, not here. It holds only tickets in flight or parked: when a ticket closes, drop it. One short file, never an archive.'''
read = ["CLAUDE.md"]
model = "fable"
decides = ["inspect", "finalize", "paused", "rerun", "pr", "branch", "lanes", "decisions", "refresh", "review-cap", "review-code", "message", "resolution", "lost-send", "tried", "merge"]
merges = true
may = ["restart"]

[policy]
slots = 4                    # tickets in flight; my-dev (count 1) serializes deploy and try
waiting_on_me = 10
trust_folders = true      # every lane worktree asks once; answered for Orchard's agents
rebaser = "rebaser"        # a lane behind its integration branch whose rebase conflicts: continued from the lane's last agent
max_rebases = 2
fixer = "ci-fixer"           # red PR checks at the branch head: cloned from the lane's last agent, told to fix, run the checks and push
max_fixes = 1                # the guide's default is 2; one fix, then red checks are a pr question
min_free_gb = 20             # the guide's default is 10; read live. Each ticket tree is ~2.3 GB and sam builds fill Docker's disk
evidence_keep_days = 30      # days after close before a ticket's evidence is removed
ports = [3100, 3199]         # for services; one per service per ticket, tested free before use
rates = { "claude-haiku-5-5" = [0.10, 0.50, 0.125, 0.20, 0.01], "claude-sonnet-5-5" = [2.0, 10.0, 2.50, 4.0, 0.10], "claude-opus-5-5" = [4.0, 20.0, 5.0, 8.0, 0.20], "gpt-5-codex" = [1.25, 10.0] }   # $ per million tokens: input, output, 5m cache write, 1h cache write, cache read; read live
decisions = { lanes = "ask", finalize = "ask", budget = "ask", review-code = "auto" }   # lanes stays ask: the auto answer reads only the labels snapshotted at take, so it cannot follow a decision
