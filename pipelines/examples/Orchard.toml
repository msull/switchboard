# A multi-lane Dispatch pipeline with one queued local resource: the shape
# of the client pipeline that runs on the author's Mac, with the names the
# guide's "Pipeline: Orchard" section uses (docs/dispatch.md). That section
# holds the first version of this file and says what each mechanism is
# for; this is what it grew into over a month of tickets. Copy it to a
# machine's Dispatch data directory as pipelines/<Name>.toml and change:
#
# - the names: Orchard, example-org/orchard-workspace, example-co, the
#   three lane repositories and their integration branches, my-dev (the
#   one stack, named in [[resources]], in every `needs`, and throughout
#   the guidance), orchard-dev (the aws-vault profile the deploy gate uses);
# - each lane's `setup`, `serve` and checks (the `per_lane` table on
#   implement, and the same commands named in the guidance);
# - the deploy gate's command, the try stage's `before` and its `env`
#   set (test personas, granted in Switchboard), the Bitbucket env set on
#   pr and ci-fixer (drop both for GitHub, where gh needs no set, and drop
#   the `provider` keys on ready and merge);
# - the ground-rules paragraph that opens every operator's guidance: it
#   is one paragraph repeated per operator, since the file format has no
#   include, so edit it in every copy (sed is the tool).
#
# The parts to keep as they are: the stage order and the gates; `needs`
# on deploy, try and tried, which holds the resource from the deploy to
# the owner's look at the evidence and lets no second ticket overwrite
# the stack in between; `context = "joined"` for plan, review and try
# and "each" for the lane stages; `commits = "one"` on review-code; the
# supervisor block's decides list and its hand-off rules; `slots` above
# 1 with the resource at `count = 1`, so tickets plan and implement in
# parallel and queue only at deploy.
#
# The decisions stage after investigate puts the investigator's open
# decisions, each with a recommendation, in front of the lead before a
# plan is written: the note names the ones decided otherwise, an empty
# note takes every recommendation, and the planner and the reviewer read
# the note as settled through `{decisions.decisions.note}`. The choices
# are the owner's and the supervisor carries the answer: it reports the
# decisions, each with its recommendation, and answers the gate with
# what the owner replies. The lanes gate comes after it, since a decision
# can change which lanes the ticket needs: the supervisor answers it from
# the investigator's recommendation and the owner's decisions, with the
# area labels as the suggestion. A ticket already taken gets the stage
# only through `dispatch restart <ticket> decisions`.
version = 1

[project]
name = "Orchard"
repo = "git@github.com:example-org/orchard-workspace.git"
space = "Dispatch · Orchard"

[source]
kind = "github"
repo = "example-org/orchard-workspace"
label = "dispatch"
# area: labels are the suggested answer to the lanes decision.
lane_hints = { "area:backend" = "backend", "area:frontend" = "frontend", "area:admin" = "admin" }

[[lanes]]
name = "backend"
path = "orchard-backend"
repo = "git@bitbucket.org:example-co/orchard-backend.git"
base = "main"
setup = ["sh", "-c", "uv sync --frozen --all-groups && mkdir -p local/caches && uv run --frozen --all-groups inv link-env --env-name my-dev"]

[[lanes]]
name = "frontend"
path = "orchard-frontend"
repo = "git@bitbucket.org:example-co/orchard-frontend.git"
base = "dev"
setup = ["npm", "ci", "--legacy-peer-deps"]
# A service Dispatch starts for a stage that asks. PORT is a port
# Dispatch allocates per ticket; the URL is what the tester is told.
serve = { argv = ["npm", "start"], env = { BROWSER = "none", PORT = "{port}" }, url = "http://localhost:{port}", ready = { http = "/", within_secs = 120 } }
merge_after = ["backend"]    # when the ticket chose both lanes, this lane's merge question waits until the backend PR has merged; not its dev deploy (merge_after_deploy = true would wait for that too, and is refused where the pipeline names Bitbucket, so the supervisor checks the deploy by hand)

[[lanes]]
name = "admin"
path = "orchard-admin"
repo = "git@bitbucket.org:example-co/orchard-admin.git"
base = "master"
setup = ["npm", "ci", "--legacy-peer-deps"]
serve = { argv = ["npm", "start"], env = { BROWSER = "none", PORT = "{port}" }, url = "http://localhost:{port}", ready = { http = "/", within_secs = 120 } }
merge_after = ["backend"]

[[resources]]
name = "my-dev"
count = 1

[operators.investigator]
kind = "claude"
guidance = '''Ground rules for every Orchard stage. Issues live in the example-org/orchard-workspace GitHub repository; the issue body you were given is a snapshot without comments, so read the comments with `gh issue view <n> -R example-org/orchard-workspace --comments` before relying on the body: decisions and scope changes are often recorded there. Each lane works on the branch Dispatch cut for it (the dispatch/... branch in its worktree); that name is accepted for Orchard PRs, so never cut, switch, rename or push under another name. my-dev is a backend-only stack: Dispatch deploys the backend lane's branch to it at the deploy stage, and at the try stage serves each chosen frontend lane's branch itself, on a port it picks, already linked to my-dev, and hands the tester that URL as the served frontend. A plan's try section therefore addresses my-dev and the served frontend by those names and tells nobody to run npm start, link-env, or a deploy; a review does not object to that wording, and a before/after comparison uses what the served frontend and my-dev show, not staging. Nothing you write or run deploys, links an environment to a different stack, edits deployed resources in the console, or promotes to staging or production. Anything that leaves the machine (commit messages, PR bodies) carries no Claude session link or attribution line, never mentions the planning workspace, its plans, guides or Dispatch, and never cites a workspace issue as `#n` or `example-org/orchard-workspace#n` (in Bitbucket `#n` links to an unrelated PR there): describe the problem in its own words. Never create, comment on, label or close GitHub issues, and never edit the workspace's guides/ or plans/; if you notice something out of scope, write it under a "Noticed" heading in your output for the lead. At the try stage the tester acts as three test personas on my-dev: admin (superuser, used for setup), supervisor, and employee (supervised by supervisor). A plan's try section says which persona does each step and what scenario admin sets up first, and needs no other accounts. Never run `inv launch-dynamodb-local` or any `docker run` with a fixed container name or host port (the `dynamodb-local` container on 8000 is a rarely used hand tool): the backend's tests start their own DynamoDB through pytest-docker on a free port, several tickets run on this machine at once, and nothing at try uses a local database; my-dev's tables are the only data store there. A change to the local table definition is verified by reading it and by the backend's own tests, not by launching DynamoDB Local. Jest spawns a worker per core and each takes about a gigabyte, so every frontend test run you start carries `--maxWorkers=3` (`CI=true npm test -- --watchAll=false --maxWorkers=3`, and the same flag on a coverage run); never run a watch-mode test, and never run two test runs at once. Search only inside your worktree and the Dispatch ticket directory your prompt names: never run `find`, `rg`, `grep -r` or `ls -R` on `/`, `~`, `/Users` or any other directory outside them. An installed package's source is in the lane's own `node_modules` (frontend, admin) or `.venv` (backend); when it is not there, say so in your output rather than searching the disk. A search outside the worktree walks other apps' data and stops the owner with a macOS permission prompt.

Your job: read the root CLAUDE.md, the CLAUDE.md of each repository the issue could touch, guides/ENVIRONMENTS_GUIDE.md, and the lessons file for the area under guides/lessons/ (guides/LESSONS_LEARNED.md is the index). Read the issue's comments. Then, checking every claim in the issue against the code on the integration branches (orchard-backend main, orchard-frontend dev, orchard-admin master) rather than trusting it: name the files, endpoints and screens involved with paths and line numbers; say what the issue gets wrong or leaves out; put every choice only the lead can make under a heading Open decisions, because it changes what the feature does or how far the ticket reaches (two readings of the issue, scope in or out, a behaviour the user would see either way), one per line, numbered, each ending with your recommendation and the one line of evidence for it (an implementation choice is the planner's and does not go here, and none is a fine answer); say whether anyone else already has the work in hand (an assignee on the issue, a claim in its comments, or an open PR on the example-org GitHub mirrors, `gh pr list -R example-org/<repo>`); and say which lanes it needs and why, which is the decision the human sees next. Say plainly what is established and what is not. Write nothing but your notes, and write them before your last turn ends: a turn that ends with no notes file is read as a failure, however many background agents are still working for you.'''

