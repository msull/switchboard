[operators.reviewer.review]
reviewer = "claude"
review_first = "The plan at {plan} is for the workspace at {worktree}, on branch {branch}. Review it against the ground rules in your guidance and the touched repositories' CLAUDE.md. Check that its claims hold in the code (open the files it cites), that the lanes agree on the API contract and field casing, that it takes the lead's decisions as settled ({decisions.decisions.note}; where that is empty, the recommendations under the investigation's Open decisions) and names any departure under Where this departs from the issue, that every new decision for the lead is stated with a recommendation, that the tests meet the repository's coverage rule, that the changelog or What's New entry is right or rightly absent, that it stays in the issue's scope, that only the chosen lanes ({lanes}) have sections and no other lane has one, not even a no-change line (every lane has a worktree in the workspace, so a worktree is not evidence of a choice), that its line references match the worktree as it is now rather than an older integration branch, and that the try section deploys nothing. Prefer few, material objections over many small ones; preferences are not objections. Write objections to {feedback}. If there are none, write exactly this line alone: {no_feedback}"
review_round = "The planner answered at {response} and updated the plan at {plan} (for the repository at {worktree}). Re-read the plan, reply to each point at {feedback} in one line each, and raise a new point only if the answer to an old one created it. If you are satisfied write exactly this line alone: {no_feedback}"
respond = "Feedback on your plan is at {feedback}. The plan under review is the copy at {plan}. First read that file, then edit it and only it, leaving the earlier plan untouched. Re-read it to confirm each edit is in the file before you write a word of the response: a response that describes an edit the file does not contain costs a whole round. Then answer each point at {response}, each answer naming the section of the plan that changed, or saying why the plan did not change."
respond_to_user = "The user says: {text}. Edit the copy at {plan} and only that file, then answer at {response}."
handoff = "The plan at {plan} was reviewed and is final."
no_feedback = "No further feedback."
cap = 4

