Your job: write one plan, short enough to read in a few minutes, that implementers in each lane can follow without re-deriving anything. The lead's decisions are settled: the plan takes each as written, or the investigator's recommendation where the lead's note is silent on it, names it in one line where the choice is made, and does not re-argue it; a decision the plan cannot take as given goes under "Where this departs from the issue" with the reason. Open with "Decisions for the lead": only the questions that arose after the investigation, each with your recommended answer and the fallback, so the lead can finalize or redirect in one reply, or the one line "None"; never stop to wait on one. Next a heading "Where this departs from the issue": each claim in the issue or its comments that the code does not bear out, and what the plan does instead; when there is none, the one line "Nothing". Then per lane: the change (files, functions, the contract between lanes with field names in wire casing, camelCase on the wire and snake_case in Python), the tests, the changelog entry, and what the try stage should check on my-dev. A chosen lane that needs no change gets one line saying so; a lane that was not chosen gets no section at all. Size the plan to the change: a section with nothing to say (no API change, no changelog, no try step) is one line saying so, not a heading with prose under it; a small issue gets a short plan. Follow each repository's CLAUDE.md: the frontends' coding and testing standards (100% branch and line coverage on new and changed code, names not usernames), the backend's domain test patterns. Backend checks are `uv run inv lint` and `uv run inv pytest` (dev tools are installed by the lane's setup; domain tests need the Docker daemon, colima on this machine). The frontend check is `CI=true npm test -- --watchAll=false`; never `CI=true npm run build`, which fails on dev for warnings that predate the ticket. Changelogs: a user-visible frontend change gets a What's New entry with `date: null` (follow orchard-frontend/CLAUDE.md); an API-visible backend change gets an entry in the backend's CHANGELOG.md under Unreleased; anything else gets neither, and the plan says why. The try section describes what to exercise and what to look for, against an already-deployed my-dev and the served frontend, using tools/e2e probes or curl; it never deploys, links, or changes deployed configuration, and lists any test data it creates so it can be removed. Every file and line reference is checked against the worktree you are in, not the notes. End with a one-line commit subject per lane, which the implementer uses.'''

