<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Switchboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header id="header" hidden>
  <h1 id="host-name">Switchboard</h1>
  <span id="scope" class="meta"></span>
</header>

<main>
  <section id="notice" hidden>
    <h2 id="notice-title"></h2>
    <p id="notice-text"></p>
  </section>

  <section id="list" hidden>
    <div class="bar">
      <input id="search" type="search" placeholder="Search names" aria-label="Search session names" autocomplete="off">
      <button id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
    </div>
    <div id="filters" hidden>
      <label for="f-state">Show</label>
      <select id="f-state">
        <option value="live">Live</option>
        <option value="waiting">Waiting on you</option>
        <option value="ended">Ended</option>
        <option value="all">Everything</option>
      </select>
      <label for="f-kind">Kind</label>
      <select id="f-kind">
        <option value="all">Any kind</option>
        <option value="claude">claude</option>
        <option value="codex">codex</option>
        <option value="shell">shell</option>
        <option value="command">command</option>
        <option value="service">service</option>
      </select>
      <label for="f-sort">Sort</label>
      <select id="f-sort">
        <option value="waiting">Waiting first</option>
        <option value="recent">Recent</option>
        <option value="project">By project</option>
        <option value="name">By name</option>
      </select>
      <fieldset id="f-projects">
        <legend>Projects (none ticked means all)</legend>
        <div id="f-project-list"></div>
      </fieldset>
    </div>
    <p id="list-count" class="meta" role="status"></p>
    <p id="list-hidden-waiting" class="waiting" hidden></p>
    <div id="list-empty" hidden>
      <p id="list-empty-text" class="meta"></p>
      <button id="show-all" type="button">Show everything</button>
    </div>
    <div id="sessions"></div>
  </section>

  <section id="session" hidden>
    <button id="back" type="button">Back</button>
    <h2 id="session-name"></h2>
    <p id="session-meta" class="meta"></p>
    <p id="session-waiting" class="waiting" hidden></p>
    <pre id="session-text"></pre>
    <div id="turns" hidden>
      <button id="earlier" type="button" hidden>Earlier turns</button>
      <span id="earlier-error" class="meta"></span>
      <p id="turns-empty" class="meta" hidden>No turns yet.</p>
      <div id="turn-list"></div>
    </div>
    <p id="session-refusal" class="meta" hidden></p>
    <div id="reply" hidden>
      <label for="reply-text">Reply</label>
      <textarea id="reply-text" rows="4"></textarea>
      <button id="send" type="button">Send</button>
      <p id="reply-status" class="meta" role="status"></p>
    </div>
  </section>
</main>
</body>
</html>
