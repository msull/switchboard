version: 2
updates:
  # Covers the workspace and the vendored terminal widget, which resolves
  # in the root `Cargo.lock`. The spikes keep their own lockfiles and are
  # left out on purpose.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before Dependabot offers it: the
    # first days are when a yanked crate or a broken point release
    # shows itself.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before Dependabot offers it: the
    # first days are when a yanked crate or a broken point release
    # shows itself.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
    # A new release waits a week before Dependabot offers it: the
    # first days are when a yanked crate or a broken point release
    # shows itself.
    cooldown:
      default-days: 7
