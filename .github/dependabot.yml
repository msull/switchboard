version: 2
updates:
  # Covers the workspace and the vendored terminal widget, which resolves
  # in the root `Cargo.lock`. The spikes keep their own lockfiles and are
  # left out on purpose.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
