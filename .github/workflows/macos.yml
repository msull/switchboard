name: macOS

# The only job that compiles the `cfg(target_os = "macos")` code (the
# Keychain, Bonjour and Dock adapters, the dispatch sandbox) and the
# only one with tmux, so the tmux integration tests run here rather
# than skip. macOS runners are scarce (the queue has reached eleven
# minutes) and a cold build takes about twenty, so it runs on every
# push to main, on a pull request that touches what only it compiles,
# and by hand from the Actions tab. It is advisory: a required check
# that a path filter skips leaves a pull request pending for ever.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'rust-toolchain.toml'
      - 'src/adapters/**'
      - 'src/main.rs'
      - 'dispatch/src/confine.rs'
      - 'dispatch/src/git.rs'
      - 'dispatch/tests/sandbox.rs'
      - 'tests/gate.rs'
      - 'vendor/egui_term/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # It runs the pre-commit hook's commands as they are, with no
  # flaky-test retry. Actions are pinned as in ci.yml.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux
        run: brew install tmux
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo test --locked -p egui_term --lib
