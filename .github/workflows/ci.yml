name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only what the lock file links: xkbcommon for the window crate,
      # ALSA for the audio crate, cmake for the whisper build. The file
      # dialog uses the desktop portal and TLS is ring, so no GTK or
      # OpenSSL. A short acquire timeout with retries: the Azure mirror
      # stalls single downloads for minutes at the 30 s default.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 install -y --no-install-recommends libxkbcommon-dev libasound2-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ./scripts/ci-test.sh
      - run: cargo test --locked -p egui_term --lib

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only what the lock file links: xkbcommon for the window crate,
      # ALSA for the audio crate, cmake for the whisper build. The file
      # dialog uses the desktop portal and TLS is ring, so no GTK or
      # OpenSSL. A short acquire timeout with retries: the Azure mirror
      # stalls single downloads for minutes at the 30 s default.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 install -y --no-install-recommends libxkbcommon-dev libasound2-dev cmake
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/ci-test.sh
