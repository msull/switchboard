[package]
name = "spike-remote-port"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike 22: a pinned-TLS HTTP and WebSocket port over std, requests handed to a frame thread, with the bounds of docs/remote-client.md measured"

# An empty workspace table makes this crate its own root so cargo never
# tries to attach it to the app crate two directories up.
[workspace]

[dependencies]
base64 = "0.22"
mdns-sd = "0.21"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha1 = "0.10"
sha2 = "0.10"
tungstenite = "0.30"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
