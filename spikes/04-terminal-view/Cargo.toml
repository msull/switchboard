[package]
name = "terminal-view-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: never fold into the repo root package/workspace.
[workspace]

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_term = { path = "vendor/egui_term" }
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
