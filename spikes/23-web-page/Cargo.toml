[package]
name = "spike-web-page"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike 23: a page over the remote port's kind of certificate, its credential an HttpOnly cookie named for the server, checked in a browser"

# An empty workspace table makes this crate its own root so cargo never
# tries to attach it to the app crate two directories up.
[workspace]

[dependencies]
base64 = "0.22"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha1 = "0.10"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
