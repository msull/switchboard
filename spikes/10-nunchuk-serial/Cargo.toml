[package]
name = "nunchuk-serial-spike"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike 10: can a Feather-attached nunchuk drive Switchboard over USB serial?"

# Standalone: never fold into the repo root package/workspace.
[workspace]

[dependencies]
# No libudev: the same flags the app will use so Linux CI builds it.
serialport = { version = "4", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
