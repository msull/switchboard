[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Switchboard - organize, manage, and automate agent coding sessions"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "switchboard"
path = "src/main.rs"

[dependencies]
arboard = "3.6"
eframe = "0.36"
egui = "0.36"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic asks for `# Errors` / `# Panics` sections on every fallible fn;
# more noise than signal in an application crate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# egui is slow in unoptimised builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
