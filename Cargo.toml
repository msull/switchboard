[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Switchboard - organize, manage, and automate agent coding sessions"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "switchboard"
path = "src/main.rs"

# Tiny helper that Claude Code hooks call; must start in well under a
# millisecond, so it uses only std.
[[bin]]
name = "switchboard-hook"
path = "src/bin/switchboard-hook.rs"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.36"
egui = "0.36"
egui_term = { path = "vendor/egui_term" }
env_logger = "0.11"
fd-lock = "4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# egui is slow in unoptimised builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
