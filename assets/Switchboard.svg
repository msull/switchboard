<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3542"/>
      <stop offset="1" stop-color="#151922"/>
    </linearGradient>
    <linearGradient id="cordA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="cordB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee0a0"/>
      <stop offset="1" stop-color="#1fb37a"/>
    </linearGradient>
    <radialGradient id="jack" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.7" stop-color="#1c212b"/>
      <stop offset="1" stop-color="#3a4150"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS-style rounded square, inset like system icons -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <!-- faceplate -->
  <rect x="190" y="230" width="644" height="564" rx="48" fill="#222834" stroke="#3b4353" stroke-width="10"/>
  <!-- jack grid: 4 x 3 -->
  <g>
    <circle cx="300" cy="360" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="441" cy="360" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="583" cy="360" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="724" cy="360" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="300" cy="512" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="441" cy="512" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="583" cy="512" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="724" cy="512" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="300" cy="664" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="441" cy="664" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="583" cy="664" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
    <circle cx="724" cy="664" r="46" fill="url(#jack)" stroke="#59627a" stroke-width="10"/>
  </g>
  <!-- patch cords -->
  <g fill="none" stroke-linecap="round" filter="url(#shadow)">
    <path d="M300 360 C 300 560, 583 470, 583 664" stroke="url(#cordA)" stroke-width="44"/>
    <path d="M724 360 C 724 560, 441 470, 441 664" stroke="url(#cordB)" stroke-width="44"/>
  </g>
  <!-- plugs -->
  <g>
    <circle cx="300" cy="360" r="30" fill="#ffb347"/>
    <circle cx="583" cy="664" r="30" fill="#ff7a1a"/>
    <circle cx="724" cy="360" r="30" fill="#5ee0a0"/>
    <circle cx="441" cy="664" r="30" fill="#1fb37a"/>
  </g>
  <!-- status lights: one waiting (orange), two working (green) -->
  <circle cx="300" cy="512" r="18" fill="#ff9f1a"/>
  <circle cx="441" cy="512" r="18" fill="#2ecc71"/>
  <circle cx="583" cy="512" r="18" fill="#2ecc71"/>
</svg>
